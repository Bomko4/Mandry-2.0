  body{-webkit-tap-highlight-color:transparent}.noscroll::-webkit-scrollbar{display:none}.noscroll{-ms-overflow-style:none;scrollbar-width:none}

      <section id="step4" class="step hidden">

        <div class="bg-white rounded-2xl p-4 shadow-sm mb-4 border border-cyan-50">

  <!-- ============ TAB: MY BOOKINGS ============ -->

      <!-- Логотип замість тексту -->
      <img src="logo.jpg" alt="Mandry SUP" class="h-7 object-contain mix-blend-multiply opacity-90">

          Поділитися номером

        <div class="flex gap-2">

  <!-- ============ TAB: ABOUT ============ -->

      <span class="text-xl">📋</span><span class="text-[11px] font-medium">Мої бронювання</span>

    <button class="nav-btn flex-1 py-2.5 flex flex-col items-center gap-0.5" data-tab="about">

<script>
const tg = window.Telegram?.WebApp;
tg?.ready(); tg?.expand();

const API_BASE_URL = "https://mandrysup.duckdns.org/api";

const TIME_SLOTS = ["10:15-11:15","11:30-12:30","12:45-13:45","14:00-15:00","15:15-16:15","16:30-17:30","17:45-18:45","19:00-20:00","20:10-21:10"];
const MORNING_WINDOW = "05:45-08:00";
const MONTHS = ["січ","лют","бер","кві","тра","чер","лип","сер","вер","жов","лис","гру"];
const DAYS = ["Нд","Пн","Вт","Ср","Чт","Пт","Сб"];
let serverClockCache = null;

/* ================= TAB SWITCHING ================= */
document.querySelectorAll('.nav-btn').forEach(btn=>{
  btn.onclick = () => switchTab(btn.dataset.tab);
});
function switchTab(name){
  document.querySelectorAll('.tab-panel').forEach(p=>p.classList.add('hidden'));
  document.getElementById('tab-'+name).classList.remove('hidden');
  document.querySelectorAll('.nav-btn').forEach(b=>{
    const active = b.dataset.tab === name;
    b.classList.toggle('text-[#0097B2]', active);
    b.classList.toggle('text-gray-400', !active);
  });
  if (name === 'bookings') renderBookings();
}
switchTab('book');

/* ================= BOOKING WIZARD ================= */
let state = { date:null, duration:null, equipment:null, quantity:1, time:null, fullName:'' };
let step = 1;

function resetBookingSelection(){
  state.time = null;
  state.equipment = null;
  state.quantity = 1;
}

const dateScroll = document.getElementById('dateScroll');

async function getServerToday(){
  if (serverClockCache?.today) return serverClockCache.todayDate;
  if (API_BASE_URL){
    try {
      const res = await fetch(`${API_BASE_URL}/server-time?_=${Date.now()}`, { cache: 'no-store' });
      if (res.ok){
        const data = await res.json();
        const [dd, mm] = String(data.today || '').split('.').map(Number);
        if (dd && mm){
          const now = new Date();
          let base = new Date(now.getFullYear(), mm - 1, dd);
          if (base - now > 300 * 24 * 60 * 60 * 1000) base.setFullYear(base.getFullYear() - 1);
          if (now - base > 300 * 24 * 60 * 60 * 1000) base.setFullYear(base.getFullYear() + 1);
          serverClockCache = { today: String(data.today || ''), now: String(data.now || ''), todayDate: base };
          return base;
        }
      }
    } catch (e) {
      console.error('getServerToday failed, falling back to device clock:', e);
    }
  }
  return new Date();
}

async function getServerClock(){
  if (serverClockCache?.today && serverClockCache?.now) return serverClockCache;
  await getServerToday();
  if (serverClockCache?.today && serverClockCache?.now) return serverClockCache;
  const now = new Date();
  const dd = String(now.getDate()).padStart(2, '0');
  const mm = String(now.getMonth() + 1).padStart(2, '0');
  const hh = String(now.getHours()).padStart(2, '0');
  const mi = String(now.getMinutes()).padStart(2, '0');
  serverClockCache = { today: `${dd}.${mm}`, now: `${hh}:${mi}`, todayDate: now };
  return serverClockCache;
}

async function isMorningClosedForDate(dateStr){
  const clock = await getServerClock();
  return clock.today === dateStr && clock.now >= MORNING_WINDOW.split('-')[0];
}

async function initDateScroll(){
  const today = await getServerToday();
  dateScroll.innerHTML = '';
  for (let i=0;i<28;i++){
    const d = new Date(today); d.setDate(d.getDate()+i);
    const isWeekend = d.getDay() === 0 || d.getDay() === 6;
    const isToday = i === 0;
    const btn = document.createElement('button');
    btn.className = 'date-btn flex-shrink-0 w-16 py-2.5 rounded-2xl bg-white border-2 shadow-sm text-center transition-colors '
      + (isToday ? 'border-[#0097B2]' : 'border-transparent hover:border-cyan-100');
    const dd = String(d.getDate()).padStart(2,'0');
    const mm = String(d.getMonth()+1).padStart(2,'0');
    btn.dataset.val = `${dd}.${mm}`;
    const dayColor = isWeekend ? 'text-[#0097B2] font-bold' : 'text-gray-400';
    const numColor = isWeekend ? 'text-[#0097B2]' : 'text-gray-800';
    btn.innerHTML = `<div class="text-[11px] ${dayColor}">${DAYS[d.getDay()]}</div><div class="text-lg font-bold leading-tight ${numColor}">${d.getDate()}</div><div class="text-[11px] text-gray-400">${MONTHS[d.getMonth()]}</div>${isToday ? '<div class="text-[9px] text-[#0097B2] font-semibold mt-0.5">сьогодні</div>' : ''}`;
    btn.onclick = () => { selectOne('.date-btn', btn); state.date = btn.dataset.val; state.time = null; state.equipment = null; checkStep1(); };
    dateScroll.appendChild(btn);
  }

  const dateStrs = Array.from(document.querySelectorAll('.date-btn')).map(b => b.dataset.val);
  if (!API_BASE_URL || dateStrs.length === 0) return;
  try {
    const res = await fetch(`${API_BASE_URL}/days-status?dates=${encodeURIComponent(dateStrs.join(','))}&_=${Date.now()}`, { cache: 'no-store' });
    if (!res.ok) throw new Error('bad response');
    const statusMap = await res.json();
    document.querySelectorAll('.date-btn').forEach(btn => {
      if (statusMap[btn.dataset.val]) {
        btn.disabled = true;
        btn.classList.add('opacity-30', 'cursor-not-allowed');
        btn.onclick = null;
        if (state.date === btn.dataset.val) { state.date = null; checkStep1(); }
      }
    });
  } catch (e) {
    console.error('fetchDaysStatus failed:', e);
  }
}
initDateScroll();
document.querySelectorAll('.dur-btn').forEach(btn=>{
  btn.onclick = () => { selectOne('.dur-btn', btn); resetBookingSelection(); state.duration = btn.dataset.val; checkStep1(); };
});
function checkStep1(){ setMainEnabled(!!state.date && !!state.duration); }

const SUPS = [
  {id:'sup_single', title:'Сап одномісний', price1h:'400грн/год', price2h:'700грн/2 год', img:'🚣'},
  {id:'sup_double', title:'Сап двомісний', price1h:'600грн/год', price2h:'1100грн/2 год', img:'🚣‍♂️'}
];
const KAYAKS = [
  {id:'kayak_single', title:'Каяк одномісний', price1h:'450грн/год', price2h:'800грн/2 год', img:'🛶'},
  {id:'kayak_double', title:'Каяк двомісний', price1h:'700грн/год', price2h:'1300грн/2 год', img:'🛶'}
];
const ALL_EQUIPMENT_IDS = ['sup_single','sup_double','kayak_single','kayak_double'];
const supScroll = document.getElementById('supScroll');
const kayakScroll = document.getElementById('kayakScroll');

let slotAvailability = {};

function currentSlotStart(){
  if (!state.time) return null;
  return state.duration === 'morning' ? MORNING_WINDOW : state.time.split('-')[0];
}

function buildEquipmentCard(item, container){
  const maxQty = slotAvailability[item.id]?.[currentSlotStart()] ?? 0;
  const disabled = maxQty === 0;
  const showQty = item.id.startsWith('sup_');
  const card = document.createElement('div');
  card.className = 'eq-card flex-shrink-0 w-40 bg-white rounded-2xl shadow-sm overflow-hidden border-2 border-transparent transition-colors '
    + (disabled ? ' opacity-40' : ' cursor-pointer hover:border-cyan-100');
  card.innerHTML = `
    <div class="h-24 bg-[#EAF8FA]/50 flex items-center justify-center text-4xl">${item.img}</div>
    <div class="p-3">
      <div class="font-semibold text-[#006477] text-sm mb-1">${item.title}</div>
      <div class="text-xs text-[#0097B2] font-medium mb-2 price-line" data-price1h="${item.price1h}" data-price2h="${item.price2h}">${item.price1h}</div>
      ${disabled ? `<div class="text-[10px] text-red-400 text-center">Немає в наявності на цей час</div>` :
        (showQty ? `<div class="flex items-center justify-between bg-cyan-50/50 rounded-xl px-1 py-1">
          <button class="qty-minus w-7 h-7 rounded-lg bg-white shadow-sm font-bold text-[#0097B2] hover:bg-cyan-50">−</button>
          <span class="qty-val text-sm font-semibold text-gray-800">1</span>
          <button class="qty-plus w-7 h-7 rounded-lg bg-white shadow-sm font-bold text-[#0097B2] hover:bg-cyan-50">+</button>
        </div>` : '')}
    </div>`;
  container.appendChild(card);
  if (disabled) return;

  const selectEquip = (qty) => { selectOne('.eq-card', card); state.equipment = item.id; state.quantity = qty; checkStep3(); };

  if (showQty){
    const qtyVal = card.querySelector('.qty-val');
    const plusBtn = card.querySelector('.qty-plus');
    const minusBtn = card.querySelector('.qty-minus');
    let qty = 1;
    const syncControls = () => {
      const atMin = qty <= 1;
      const atMax = qty >= maxQty;
      plusBtn.disabled = atMax;
      plusBtn.classList.toggle('opacity-30', atMax);
      plusBtn.classList.toggle('cursor-not-allowed', atMax);
      plusBtn.classList.toggle('pointer-events-none', atMax);
      minusBtn.disabled = atMin;
      minusBtn.classList.toggle('opacity-30', atMin);
      minusBtn.classList.toggle('cursor-not-allowed', atMin);
      minusBtn.classList.toggle('pointer-events-none', atMin);
    };
    syncControls();
    minusBtn.onclick = e => { e.stopPropagation(); qty = Math.max(1, qty-1); qtyVal.textContent = qty; syncControls(); selectEquip(qty); };
    plusBtn.onclick = e => { e.stopPropagation(); qty = Math.min(maxQty, qty+1); qtyVal.textContent = qty; syncControls(); selectEquip(qty); };
    card.onclick = () => selectEquip(qty);
  } else {
    card.onclick = () => selectEquip(1);
  }
}

function buildEquipmentCards(){
  supScroll.innerHTML = '';
  kayakScroll.innerHTML = '';
  SUPS.forEach(item => buildEquipmentCard(item, supScroll));
  KAYAKS.forEach(item => buildEquipmentCard(item, kayakScroll));
  updateEquipmentPrices();
}
function checkStep3(){ setMainEnabled(!!state.equipment); }
function updateEquipmentPrices(){
  const use2h = state.duration === '2';
  document.querySelectorAll('.price-line').forEach(el => {
    el.textContent = use2h ? el.dataset.price2h : el.dataset.price1h;
  });
}

const timeGrid = document.getElementById('timeGrid');
let timeSlotsRequestSeq = 0;

function addMinutesToTime(hhmm, minutesToAdd){
  const [h, m] = hhmm.split(':').map(Number);
  const total = h * 60 + m + minutesToAdd;
  const nh = Math.floor((total % (24*60)) / 60);
  const nm = total % 60;
  return String(nh).padStart(2,'0') + ':' + String(nm).padStart(2,'0');
}

async function fetchAvailability(date, duration){
  if (!API_BASE_URL){
    return duration === 'morning' ? { closed: true, available: false, maxQty: 0 } : { closed: true, slots: [] };
  }
  try {
    const res = await fetch(`${API_BASE_URL}/availability?date=${encodeURIComponent(date)}&equipment=all&duration=${encodeURIComponent(duration)}&_=${Date.now()}`, { cache: 'no-store' });
    if (!res.ok) throw new Error('bad response');
    return await res.json();
  } catch (e) {
    console.error('fetchAvailability failed:', e);
    return duration === 'morning' ? { closed: true, available: false, maxQty: 0 } : { closed: true, slots: [] };
  }
}

async function fetchDayClosed(date){
  if (!API_BASE_URL) return false;
  try {
    const res = await fetch(`${API_BASE_URL}/days-status?dates=${encodeURIComponent(date)}&_=${Date.now()}`, { cache: 'no-store' });
    if (!res.ok) throw new Error('bad response');
    const data = await res.json();
    return !!data[date];
  } catch (error) {
    return false;
  }
}

async function fetchDetailedAvailability(date, duration){
  const result = { closed: true, slots: [] };
  if (!API_BASE_URL) return result;

  const responses = await Promise.all(
    ALL_EQUIPMENT_IDS.map(async (id) => {
      try {
        const res = await fetch(`${API_BASE_URL}/availability?date=${encodeURIComponent(date)}&equipment=${encodeURIComponent(id)}&duration=${encodeURIComponent(duration)}&_=${Date.now()}`, { cache: 'no-store' });
        if (!res.ok) throw new Error('bad response');
        return { id, data: await res.json() };
      } catch (error) {
        return { id, data: duration === 'morning' ? { closed: true, available: false, maxQty: 0 } : { closed: true, slots: [] } };
      }
    })
  );

  if (duration === 'morning'){
    const availableByEquipment = {};
    let maxQty = 0;
    responses.forEach(({ id, data }) => {
      const qty = data.closed ? 0 : (data.maxQty || 0);
      availableByEquipment[id] = qty;
      if (qty > maxQty) maxQty = qty;
    });
    return { closed: false, morning: true, available: maxQty > 0, maxQty, availableByEquipment };
  }

  const slotsMap = new Map();
  responses.forEach(({ id, data }) => {
    const slotList = data.closed ? [] : (data.slots || []);
    slotList.forEach(slot => {
      const current = slotsMap.get(slot.start) || { start: slot.start, availableByEquipment: {} };
      current.availableByEquipment[id] = slot.available ? (slot.maxQty || 0) : 0;
      slotsMap.set(slot.start, current);
    });
  });

  const slots = Array.from(slotsMap.values()).map(slot => {
    const maxQty = Math.max(0, ...Object.values(slot.availableByEquipment || {}));
    return { ...slot, available: maxQty > 0, maxQty };
  }).sort((a, b) => a.start.localeCompare(b.start));

  return { closed: false, slots };
}

async function renderTimeSlots(){
  const requestSeq = ++timeSlotsRequestSeq;
  timeGrid.innerHTML = '<div class="col-span-2 text-center text-sm text-[#0097B2] py-4">Завантаження…</div>';
  slotAvailability = {};
  if (state.duration === 'morning' && await isMorningClosedForDate(state.date)){
    timeGrid.innerHTML = '<div class="col-span-2 text-center text-sm text-gray-400 py-4">Ранковий сплав на сьогодні вже недоступний.</div>';
    return;
  }
  let summary = await fetchAvailability(state.date, state.duration);
  if (requestSeq !== timeSlotsRequestSeq) return;

  const dayClosed = await fetchDayClosed(state.date);
  if (requestSeq !== timeSlotsRequestSeq) return;

  const summaryLooksBad = !summary || summary.error || (!summary.closed && !summary.slots);
  const summaryEmptyButDayOpen = !summary?.closed && Array.isArray(summary?.slots) && summary.slots.length === 0 && !dayClosed;
  const summaryClosedButDayOpen = !!summary?.closed && !dayClosed;
  if (!dayClosed && (summaryLooksBad || summaryEmptyButDayOpen || summaryClosedButDayOpen)){
    summary = await fetchDetailedAvailability(state.date, state.duration);
    if (requestSeq !== timeSlotsRequestSeq) return;
  }

  timeGrid.innerHTML = '';

  if (state.duration === 'morning'){
    ALL_EQUIPMENT_IDS.forEach(id => {
      const qty = summary.availableByEquipment?.[id] ?? 0;
      slotAvailability[id] = { [MORNING_WINDOW]: qty };
    });
    const isSelectable = !summary.closed && (summary.maxQty || 0) > 0;
    const btn = document.createElement('button');
    btn.className = 'time-btn col-span-2 py-3 rounded-2xl border-2 border-transparent shadow-sm font-medium transition-colors '
      + (isSelectable ? 'bg-white hover:border-cyan-100' : 'bg-gray-100 text-gray-300 cursor-not-allowed');
    btn.textContent = MORNING_WINDOW;
    btn.disabled = !isSelectable;
    if (isSelectable){
      btn.onclick = () => { selectOne('.time-btn', btn); state.time = MORNING_WINDOW; state.equipment = null; setMainEnabled(true); };
    }
    timeGrid.appendChild(btn);
    if (!isSelectable){
      const note = document.createElement('div');
      note.className = 'col-span-2 text-center text-xs text-gray-400 mt-2';
      note.textContent = 'На цю дату ранковий сплав недоступний.';
      timeGrid.appendChild(note);
    }
    return;
  }

  if (summary.closed){
    timeGrid.innerHTML = '<div class="col-span-2 text-center text-sm text-gray-400 py-4">На цю дату немає вільних місць</div>';
    return;
  }

  const dur = parseInt(state.duration || '1', 10);
  ALL_EQUIPMENT_IDS.forEach(id => slotAvailability[id] = {});
  const startTimes = TIME_SLOTS.slice(0, TIME_SLOTS.length - dur + 1).map(slot => slot.split('-')[0]);

  (summary.slots || []).forEach(slot => {
    const end = addMinutesToTime(slot.start, dur * 60);
    const label = `${slot.start}–${end}`;
    const availableByEquipment = slot.availableByEquipment || {};

    ALL_EQUIPMENT_IDS.forEach(id => {
      slotAvailability[id][slot.start] = availableByEquipment[id] ?? 0;
    });

    const isSelectable = (slot.maxQty || 0) > 0;
    const btn = document.createElement('button');
    btn.className = 'time-btn py-3 rounded-2xl border-2 border-transparent shadow-sm font-medium text-sm transition-colors '
      + (isSelectable ? 'bg-white hover:border-cyan-100' : 'bg-gray-100 text-gray-300 cursor-not-allowed');
    btn.textContent = label;
    btn.disabled = !isSelectable;
    if (isSelectable){
      btn.onclick = () => { selectOne('.time-btn', btn); state.time = TIME_SLOTS.find(s => s.startsWith(slot.start)); state.equipment = null; setMainEnabled(true); };
    }
    timeGrid.appendChild(btn);
  });
}

function renderSummary(){

function selectOne(selector, active){
  document.querySelectorAll(selector).forEach(el => el.classList.remove('border-[#0097B2]'));

}
function setMainEnabled(ok){ document.getElementById('mainBtn').disabled = !ok; }

function showStep(n){
  clearWizardNotice();
  document.querySelectorAll('.step').forEach(s => s.classList.add('hidden'));
  document.getElementById('step'+n).classList.remove('hidden');
  document.getElementById('stepLabel').textContent = `Крок ${n} з 4`;
  document.getElementById('progressBar').style.width = (n*25)+'%';
  document.getElementById('backBtn').style.visibility = n === 1 ? 'hidden' : 'visible';
  const mainBtn = document.getElementById('mainBtn');
  if (n === 1) setMainEnabled(!!state.date && !!state.duration);
  if (n === 2) {
    resetBookingSelection();
    setMainEnabled(false);
    renderTimeSlots().catch(error => {
      console.error('renderTimeSlots failed:', error);
      timeGrid.innerHTML = '<div class="col-span-2 text-center text-sm text-gray-400 py-4">Не вдалося завантажити доступні години</div>';
    });
  }
  if (n === 3) { setMainEnabled(false); buildEquipmentCards(); setMainEnabled(!!state.equipment); }
  if (n === 4) { renderSummary(); setMainEnabled(state.fullName.length > 2); mainBtn.textContent = 'Поділитись номером і забронювати'; }
  else mainBtn.textContent = 'Далі';
}
function nextStep(){ if (step === 4){ submitBooking(); return; } step++; showStep(step); }
function prevStep(){ if (step === 1) return; step--; showStep(step); }

function showWizardNotice(text, isError){
  let el = document.getElementById('wizardNotice');
  if (!el){
    el = document.createElement('div');
    el.id = 'wizardNotice';
    el.className = 'fixed left-0 right-0 bottom-24 px-4 z-40';
    document.getElementById('app').appendChild(el);
  }
  el.innerHTML = `<div class="max-w-md mx-auto rounded-xl px-4 py-3 text-sm font-medium shadow-lg text-center ${isError ? 'bg-red-50 text-red-600 border border-red-100' : 'bg-cyan-50 text-[#0097B2] border border-cyan-100'}">${text}</div>`;
}
function clearWizardNotice(){
  const el = document.getElementById('wizardNotice');
  if (el) el.remove();
}

async function submitBooking(){
  if (!tg?.sendData){
    showWizardNotice('❌ Це можливо лише всередині Telegram. Відкрийте застосунок через кнопку в чаті з ботом.', true);
    return;
  }

  const mainBtn = document.getElementById('mainBtn');
  mainBtn.disabled = true;
  mainBtn.textContent = 'Перевіряємо наявність…';
  clearWizardNotice();

  try {
    if (state.duration === 'morning' && await isMorningClosedForDate(state.date)){
      mainBtn.disabled = false;
      mainBtn.textContent = 'Далі';
      showWizardNotice('Ранковий сплав на сьогодні вже розпочався або завершився.', true);
      return;
    }

    const fresh = await fetchAvailability(state.date, state.duration);
    let stillAvailable = false;
    if (state.duration === 'morning'){
      stillAvailable = !fresh.closed && (fresh.availableByEquipment?.[state.equipment] ?? 0) >= state.quantity;
    } else {
      const slotStart = state.time.split('-')[0];
      const slot = (fresh.slots || []).find(s => s.start === slotStart);
      stillAvailable = !fresh.closed && !!slot && (slot.availableByEquipment?.[state.equipment] ?? 0) >= state.quantity;
    }
    if (!stillAvailable){
      mainBtn.disabled = false;
      mainBtn.textContent = 'Поділитись номером і забронювати';
      showWizardNotice('⚠️ Це місце щойно зайняли. Оберіть інший час.', true);
      return;
    }
  } catch (e) {
    console.error('pre-submit availability check failed:', e);
  }

  const payload = { type:'booking', date: state.date, duration: state.duration, equipment: state.equipment, quantity: state.quantity, time: state.time, full_name: state.fullName };
  const send = (phone) => {
    if (phone) payload.phone = phone;
    mainBtn.textContent = 'Надсилаємо…';
    tg.sendData(JSON.stringify(payload));
    showWizardNotice('✅ Заявку надіслано! Підтвердження прийде в чаті з ботом.', false);
    setTimeout(() => tg?.close(), 600);
  };
  if (tg?.requestContact){
    tg.requestContact((shared, contact) => {
      const phone = shared ? contact?.responseUnsafe?.contact?.phone_number : null;
      if (!phone){
        mainBtn.disabled = false;
        mainBtn.textContent = 'Поділитись номером і забронювати';
        showWizardNotice('❌ Без номера телефону бронювання неможливе. Спробуйте ще раз і поділіться контактом.', true);
        return;
      }
      send(phone);
    });
  } else {
    mainBtn.disabled = false;
    mainBtn.textContent = 'Поділитись номером і забронювати';
    showWizardNotice('❌ Цей клієнт Telegram не підтримує надсилання контакту.', true);
  }
}
showStep(1);

const bookingsList = document.getElementById('bookingsList');

function normalizePhoneInput(value){
  const digits = String(value || '').replace(/\D/g, '');
  if (!digits) return '';
  return `+${digits}`;
}

async function shareBookingContact(){
  if (!tg?.requestContact){
    bookingSearchHint.textContent = 'Контактний доступ недоступний у цьому клієнті Telegram.';
    return;
  }
  bookingSearchHint.textContent = 'Запитуємо контакт…';

  try {
    const result = await new Promise((resolve) => {
      tg.requestContact((shared, contact) => {
        resolve({
          shared,
          phone: shared ? contact?.responseUnsafe?.contact?.phone_number : null,
        });
      });
    });

    if (!result.shared || !result.phone){
      bookingSearchHint.textContent = 'Контакт не було надано.';
      return;
    }
    const normalizedPhone = normalizePhoneInput(result.phone);
    await renderBookings(normalizedPhone);
  } catch (error) {
    console.error('shareBookingContact failed:', error);
    bookingSearchHint.textContent = 'Не вдалося отримати контакт.';
  }
}

async function fetchMyBookings(phone){
  if (!API_BASE_URL || (!phone && !tg?.initDataUnsafe?.user?.id)) return [];
  const params = new URLSearchParams();
  if (phone) params.set('phone', phone);
  if (tg?.initDataUnsafe?.user?.id) params.set('user_id', String(tg.initDataUnsafe.user.id));
  params.set('_', String(Date.now()));
  const res = await fetch(`${API_BASE_URL}/mybookings?${params.toString()}`, { cache: 'no-store' });
  if (!res.ok) throw new Error('bad response');
  return await res.json();
}

function renderBookingsEmptyState(message){
  bookingsList.innerHTML = `<div class="text-center text-gray-400 text-sm mt-10">${message}</div>`;
}
function renderBookingSearchState(){
  bookingSearchHint.textContent = 'Натисніть кнопку, щоб поділитися номером і завантажити свої бронювання.';
}

async function renderBookings(phone){
  const normalizedPhone = normalizePhoneInput(phone);
  if (!normalizedPhone && !tg?.initDataUnsafe?.user?.id){
    renderBookingSearchState();
    renderBookingsEmptyState('Спершу поділіться номером телефону або відкрийте Mini App у Telegram.');
    return;
  }

  bookingSearchHint.textContent = normalizedPhone
    ? `Шукаємо бронювання за ${normalizedPhone}…`
    : 'Шукаємо бронювання за профілем Telegram…';
  bookingsList.innerHTML = `<div class="text-center text-[#0097B2] text-sm mt-10">Завантаження…</div>`;
  let bookings;
  try {
    bookings = await fetchMyBookings(normalizedPhone);
  } catch (e) {
    console.error('fetchMyBookings failed:', e);
    bookingSearchHint.textContent = 'Не вдалося виконати пошук. Спробуйте ще раз.';
    bookingsList.innerHTML = `<div class="text-center text-gray-400 text-sm mt-10">Не вдалося завантажити бронювання. Спробуйте ще раз.</div>`;
    return;
  }

  if (bookings.length === 0){
    bookingSearchHint.textContent = `Бронювань за ${normalizedPhone} не знайдено.`;
    bookingsList.innerHTML = `<div class="text-center text-gray-400 text-sm mt-10">У вас ще немає бронювань</div>`;
    return;
  }

  bookingSearchHint.textContent = `Знайдено ${bookings.length} бронювань за ${normalizedPhone}.`;
  bookingsList.innerHTML = '';
  bookings.forEach(b => {
    const card = document.createElement('div');
    card.className = 'bg-white rounded-2xl p-4 shadow-sm border border-cyan-50';
    card.innerHTML = `
      <div class="flex justify-between items-start mb-2">
        <div class="text-sm text-gray-400">Код бронювання</div>
        <div class="text-sm font-bold tracking-wide text-[#006477]">#${b.code}</div>
      </div>
      <div class="flex justify-between text-sm mb-1"><span class="text-gray-400">Дата</span><span class="font-medium text-[#006477]">${b.date}</span></div>
      <div class="flex justify-between text-sm mb-1"><span class="text-gray-400">Час</span><span class="font-medium text-[#006477]">${b.time}</span></div>
      <div class="flex justify-between text-sm mb-3"><span class="text-gray-400">Спорядження</span><span class="font-medium text-right text-[#006477]">${b.equipment}</span></div>
      <button class="cancel-btn w-full bg-red-50 text-red-500 font-semibold py-2.5 rounded-xl transition hover:bg-red-100">Скасувати бронювання</button>`;
    card.querySelector('.cancel-btn').onclick = () => cancelBooking(b.code, card);
    bookingsList.appendChild(card);
  });
}

bookingShareBtn.onclick = () => shareBookingContact();

function cancelBooking(code, cardEl){
  if (!tg?.sendData){
    bookingSearchHint.textContent = '❌ Скасування можливе лише всередині Telegram.';
    return;
  }
  const btn = cardEl.querySelector('.cancel-btn');
  cardEl.style.opacity = '0.4';
  btn.textContent = 'Скасовується…';
  btn.disabled = true;
  tg.sendData(JSON.stringify({ type:'cancel', cancel_code: code }));
  btn.textContent = '✅ Надіслано, перевірте чат';
  setTimeout(() => tg?.close(), 900);
}
